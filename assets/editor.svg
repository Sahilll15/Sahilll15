    <radialGradient id="ga" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#e2ff2d" stop-opacity="0.5"/><stop offset="100%" stop-color="#e2ff2d" stop-opacity="0"/></radialGradient>
    <radialGradient id="gb" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#5b8cff" stop-opacity="0.45"/><stop offset="100%" stop-color="#5b8cff" stop-opacity="0"/></radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="16" stdDeviation="26" flood-color="#000000" flood-opacity="0.55"/></filter>
