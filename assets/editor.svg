      <text x="372" y="224"><tspan fill="#d6dcc8">company</tspan><tspan fill="#6f756d">: </tspan><tspan fill="#a8d962">'Contentstack'</tspan><tspan fill="#6f756d">,</tspan></text>
      <text x="372" y="252"><tspan fill="#d6dcc8">stack</tspan><tspan fill="#6f756d">:   [</tspan><tspan fill="#a8d962">'React'</tspan><tspan fill="#6f756d">, </tspan><tspan fill="#a8d962">'Node'</tspan><tspan fill="#6f756d">, </tspan><tspan fill="#a8d962">'TypeScript'</tspan><tspan fill="#6f756d">, </tspan><tspan fill="#a8d962">'AWS'</tspan><tspan fill="#6f756d">],</tspan></text>
      <text x="372" y="280"><tspan fill="#d6dcc8">focus</tspan><tspan fill="#6f756d">:   [</tspan><tspan fill="#a8d962">'Cloud'</tspan><tspan fill="#6f756d">, </tspan><tspan fill="#a8d962">'AI/ML'</tspan><tspan fill="#6f756d">, </tspan><tspan fill="#a8d962">'Micro-Frontends'</tspan><tspan fill="#6f756d">],</tspan></text>
      <text x="372" y="308"><tspan fill="#d6dcc8">openTo</tspan><tspan fill="#6f756d">:  </tspan><tspan fill="#a8d962">'collaboration &amp; open-source'</tspan><tspan fill="#6f756d">,</tspan></text>
      <text x="344" y="336"><tspan fill="#6f756d">}</tspan></text>
      <text x="344" y="392"><tspan fill="#5b8cff">developer</tspan><tspan fill="#e2ff2d">.ship</tspan><tspan fill="#6f756d">()</tspan><tspan fill="#4c5346">   // ⚡ building impactful products</tspan></text>
